name: CI

# Build and test on every PR and on pushes to the long-lived branches.
# The test suite is hermetic: no secrets, no network, no Discord, no SQL Server (see docs/testing.md),
# so this workflow needs no secrets and must never be given any.

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ValorantApp.sln

      - name: Build
        run: dotnet build ValorantApp.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ValorantApp.sln --no-build --configuration Release --verbosity normal
